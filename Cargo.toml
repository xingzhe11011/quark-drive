[workspace]
members = [
  "crates/quark-protocol",
  "crates/quark-store",
  "crates/quark-core",
  "crates/quark-testkit",
  "apps/cli",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cookie = "0.18"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
md-5 = "0.10"
mime_guess = "2"
percent-encoding = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

quark-protocol = { path = "crates/quark-protocol" }
quark-store = { path = "crates/quark-store" }
quark-core = { path = "crates/quark-core" }
